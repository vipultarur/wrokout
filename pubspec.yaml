name: workout
description: "A comprehensive workout and fitness tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI & Charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1

  cupertino_icons: ^1.0.8

  xml: ^6.5.0
  path_drawing: ^1.0.1
  animated_bubble_navigation_bar: ^1.1.0
  hugeicons: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/exercises/images/
    - assets/exercises/videos/
    - assets/svg/
    - assets/svg/female_parts/
    - assets/svg/male_parts/
